<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONAFE - Gestión de Usuarios</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    
    <style>
        body {
            background-color: #f5f7fb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .card-header {
            background: linear-gradient(135deg, #0066cc 0%, #004d99 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #0066cc 0%, #004d99 100%);
            border: none;
        }
        
        .table th {
            background-color: #f8f9fa;
            border-top: none;
        }
        
        .badge-online {
            background-color: #28a745;
        }
        
        .badge-offline {
            background-color: #6c757d;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #0066cc;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-arrow-left me-2"></i>
                <strong>CONAFE</strong> - Usuarios
            </a>
            <div class="d-flex">
                <a href="registro-movil.html" class="btn btn-light me-2">
                    <i class="fas fa-user-plus me-1"></i> Nuevo Usuario
                </a>
                <a href="dashboard.html" class="btn btn-outline-light">
                    <i class="fas fa-home me-1"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0"><i class="fas fa-users me-2"></i> Gestión de Usuarios</h3>
                        <p class="mb-0 opacity-75">Administra maestros y responsables del sistema</p>
                    </div>
                    <div class="card-body">
                        <!-- Filtros -->
                        <div class="row mb-4">
                            <div class="col-md-4">
                                <label class="form-label">Filtrar por rol:</label>
                                <select class="form-select" id="filtroRol">
                                    <option value="todos">Todos los roles</option>
                                    <option value="maestro">Maestros</option>
                                    <option value="responsable">Responsables</option>
                                    <option value="admin">Administradores</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Filtrar por estado:</label>
                                <select class="form-select" id="filtroEstado">
                                    <option value="todos">Todos los estados</option>
                                    <option value="activo">Activos</option>
                                    <option value="inactivo">Inactivos</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Buscar:</label>
                                <input type="text" class="form-control" id="buscarUsuario" placeholder="Nombre, email o teléfono...">
                            </div>
                        </div>
                        
                        <!-- Tabla de usuarios -->
                        <div class="table-responsive">
                            <table class="table table-hover" id="tablaUsuarios">
                                <thead>
                                    <tr>
                                        <th>Usuario</th>
                                        <th>Rol</th>
                                        <th>Comunidad</th>
                                        <th>Teléfono</th>
                                        <th>Estado</th>
                                        <th>Registro</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="usuariosList">
                                    <!-- Los usuarios se cargarán aquí -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Container -->
    <div id="alert-container"></div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery & DataTables -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    
    <!-- Configuración -->
    <script src="config.js"></script>
    
    <!-- Script para usuarios -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar autenticación
            const usuario = conafeConfig.verificarAutenticacion();
            if (!usuario) return;
            
            // Cargar usuarios
            cargarUsuarios();
            
            // Configurar eventos
            document.getElementById('filtroRol').addEventListener('change', cargarUsuarios);
            document.getElementById('filtroEstado').addEventListener('change', cargarUsuarios);
            document.getElementById('buscarUsuario').addEventListener('input', cargarUsuarios);
        });
        
        async function cargarUsuarios() {
            try {
                const snapshot = await conafeConfig.db.usuarios.once('value');
                const usuariosList = document.getElementById('usuariosList');
                
                if (!snapshot.exists()) {
                    usuariosList.innerHTML = `
                        <tr>
                            <td colspan="7" class="text-center py-4">
                                <div class="alert alert-info">
                                    <i class="fas fa-info-circle me-2"></i>
                                    No hay usuarios registrados en el sistema
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }
                
                let html = '';
                snapshot.forEach(childSnapshot => {
                    const usuario = childSnapshot.val();
                    usuario.id = childSnapshot.key;
                    
                    // Aplicar filtros
                    const filtroRol = document.getElementById('filtroRol').value;
                    const filtroEstado = document.getElementById('filtroEstado').value;
                    const busqueda = document.getElementById('buscarUsuario').value.toLowerCase();
                    
                    if (filtroRol !== 'todos' && usuario.rol !== filtroRol) return;
                    
                    if (filtroEstado === 'activo' && usuario.activo === false) return;
                    if (filtroEstado === 'inactivo' && usuario.activo !== false) return;
                    
                    if (busqueda && 
                        !usuario.nombre.toLowerCase().includes(busqueda) &&
                        !usuario.email.toLowerCase().includes(busqueda) &&
                        !usuario.telefono.includes(busqueda)) {
                        return;
                    }
                    
                    // Formatear datos
                    const fechaRegistro = usuario.creado_en ? 
                        new Date(usuario.creado_en).toLocaleDateString('es-MX') : 
                        'No especificada';
                    
                    const rolBadge = usuario.rol === 'maestro' ? 
                        '<span class="badge bg-primary">Maestro</span>' : 
                        usuario.rol === 'responsable' ? 
                        '<span class="badge bg-warning">Responsable</span>' : 
                        '<span class="badge bg-danger">Admin</span>';
                    
                    const estadoBadge = usuario.activo === false ? 
                        '<span class="badge bg-danger">Inactivo</span>' : 
                        '<span class="badge bg-success">Activo</span>';
                    
                    let comunidadInfo = 'Sin comunidad';
                    if (usuario.comunidad_nombre) {
                        comunidadInfo = usuario.comunidad_nombre;
                    } else if (usuario.comunidades && usuario.comunidades.length > 0) {
                        comunidadInfo = `${usuario.comunidades.length} comunidades`;
                    }
                    
                    // Obtener iniciales para avatar
                    const iniciales = usuario.nombre ? 
                        usuario.nombre.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2) : 
                        '??';
                    
                    html += `
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="user-avatar me-3">
                                        ${iniciales}
                                    </div>
                                    <div>
                                        <strong>${usuario.nombre}</strong><br>
                                        <small class="text-muted">${usuario.email || 'Sin email'}</small>
                                    </div>
                                </div>
                            </td>
                            <td>${rolBadge}</td>
                            <td>${comunidadInfo}</td>
                            <td>${usuario.telefono || 'No especificado'}</td>
                            <td>${estadoBadge}</td>
                            <td>${fechaRegistro}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="verUsuario('${usuario.id}')">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-warning me-1" onclick="editarUsuario('${usuario.id}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="eliminarUsuario('${usuario.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                
                usuariosList.innerHTML = html || `
                    <tr>
                        <td colspan="7" class="text-center py-4">
                            <div class="alert alert-warning">
                                <i class="fas fa-search me-2"></i>
                                No se encontraron usuarios con los filtros aplicados
                            </div>
                        </td>
                    </tr>
                `;
                
            } catch (error) {
                console.error('Error cargando usuarios:', error);
                conafeConfig.mostrarAlerta('Error al cargar usuarios', 'danger');
            }
        }
        
        function verUsuario(id) {
            window.location.href = `detalles-usuario.html?id=${id}`;
        }
        
        function editarUsuario(id) {
            conafeConfig.mostrarAlerta('Función de edición en desarrollo', 'info');
        }
        
        async function eliminarUsuario(id) {
            if (!confirm('¿Estás seguro de desactivar este usuario? El usuario no podrá acceder al sistema.')) {
                return;
            }
            
            try {
                await conafeConfig.db.usuarios.child(id).update({
                    activo: false,
                    actualizado_en: firebase.database.ServerValue.TIMESTAMP
                });
                
                conafeConfig.mostrarAlerta('Usuario desactivado exitosamente', 'success');
                cargarUsuarios();
                
            } catch (error) {
                console.error('Error desactivando usuario:', error);
                conafeConfig.mostrarAlerta('Error al desactivar usuario', 'danger');
            }
        }
    </script>
</body>
</html>
