<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONAFE - Configuración del Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary shadow">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-arrow-left me-2"></i>
                <strong>CONAFE</strong> / Configuración del Sistema
            </a>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <i class="fas fa-cogs"></i> Navegación
                    </div>
                    <div class="card-body p-0">
                        <div class="list-group list-group-flush">
                            <a href="#general" class="list-group-item list-group-item-action active" 
                               onclick="cargarSeccionConfig('general')">
                                <i class="fas fa-sliders-h"></i> Configuración General
                            </a>
                            <a href="#seguridad" class="list-group-item list-group-item-action" 
                               onclick="cargarSeccionConfig('seguridad')">
                                <i class="fas fa-shield-alt"></i> Seguridad
                            </a>
                            <a href="#notificaciones" class="list-group-item list-group-item-action" 
                               onclick="cargarSeccionConfig('notificaciones')">
                                <i class="fas fa-bell"></i> Notificaciones
                            </a>
                            <a href="#app-movil" class="list-group-item list-group-item-action" 
                               onclick="cargarSeccionConfig('app-movil')">
                                <i class="fas fa-mobile-alt"></i> App Móvil
                            </a>
                            <a href="#backup" class="list-group-item list-group-item-action" 
                               onclick="cargarSeccionConfig('backup')">
                                <i class="fas fa-database"></i> Backup y Restauración
                            </a>
                            <a href="#integraciones" class="list-group-item list-group-item-action" 
                               onclick="cargarSeccionConfig('integraciones')">
                                <i class="fas fa-plug"></i> Integraciones
                            </a>
                            <a href="#avanzada" class="list-group-item list-group-item-action" 
                               onclick="cargarSeccionConfig('avanzada')">
                                <i class="fas fa-code"></i> Configuración Avanzada
                            </a>
                        </div>
                    </div>
                </div>
                
                <div class="card mt-3">
                    <div class="card-header bg-success text-white">
                        <i class="fas fa-info-circle"></i> Estado del Sistema
                    </div>
                    <div class="card-body">
                        <div id="estadoSistema">
                            <!-- Estado se cargará aquí -->
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-9">
                <div id="contenidoConfiguracion">
                    <!-- Secciones de configuración se cargarán aquí -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="admin.js"></script>
    <script src="configuracion.js"></script>
</body>
</html>
